<div class="orders-container">
    <app-delete-dialog class="orders-delete-dialog" *ngIf="deleteDialog" [message]="deleteMessage"
        (cancel)="cancelProcess($event)" (delete)="deleteProcess($event)"></app-delete-dialog>
    <app-form class="orders-form-edit-dialog" *ngIf="editOrderForm" [message]="formMessage"
        [formCreation]="formCreation" (cancel)="cancelSubmission($event)"
        (submit)="submitSubmission($event)"></app-form>
    <app-form class="orders-form-edit-dialog" *ngIf="createOrderForm" [message]="formMessage"
        [formCreation]="newformCreation" (cancel)="cancelRegisteration($event)"
        (submit)="submitRegisteration($event)"></app-form>
    <app-table header="Registered Orders" [dataSource]="ordersData" [columnsToDisplay]="columnsToDisplay"
        [displayedColumnKeys]="displayedColumnKeys" [length]="length" [pageSize]="pageSize"
        [pageServices]="pageServices" (register)="createElement()" [pageSizeOptions]="pageSizeOptions"
        [formToDisplay]="formToDisplay" [expandable]="true" [actions]="actions" (refresh)="refresh($event)"
        (editing)="editElement($event)" (deleting)="deleteElement($event)"></app-table>
</div>
