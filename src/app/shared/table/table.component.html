<div class="table-container">
  <div class="table-container-header">
    {{header}}
  </div>
  <div class="table-container-table">
    <table mat-table [dataSource]="dataSource" multiTemplateDataRows class="mat-elevation-z8">
      <!-- Dynamic column definitions -->
      <ng-container *ngFor="let column of columnsToDisplay" [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef> {{ column.label }} </th>
        <ng-container *ngIf="column.key !== 'actions'; else actionsCell">
          <td mat-cell *matCellDef="let element"> {{ element[column.key] }} </td>
        </ng-container>
        <ng-template #actionsCell>
          <td mat-cell *matCellDef="let element">
            <!-- Put your actions here, e.g. buttons -->
            <button mat-icon-button color="primary" (click)="editElement(element)"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" (click)="deleteElement(element)"><mat-icon>delete</mat-icon></button>
          </td>
        </ng-template>
      </ng-container>

      <!-- Expanded Content Column -->
      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplay.length">
          <div class="example-element-detail" [@detailExpand]="element == expandedElement ? 'expanded' : 'collapsed'">
            <p *ngIf="actions"><button mat-icon-button color="primary"
                (click)="editElement(element)"><mat-icon>edit</mat-icon></button>
              <button mat-icon-button color="warn" (click)="deleteElement(element)"><mat-icon>delete</mat-icon></button>
            </p>
            <div *ngFor="let field of formToDisplay" class="expanded-row-field">
              <div style="margin:1em;"> <strong>{{field.label}}</strong>: {{getNestedValue(element, field.key)}} </div>
            </div>
          </div>
        </td>
      </ng-container>

      <!-- Row declarations -->
      <tr mat-header-row *matHeaderRowDef="displayedColumnKeys"></tr>

      <tr mat-row *matRowDef="let element; columns: displayedColumnKeys" class="example-element-row"
        [class.example-expanded-row]="expandedElement === element"
        (click)="expandedElement = expandedElement === element ? null : element">
      </tr>

      <ng-container *ngIf="expandable">
        <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
      </ng-container>
    </table>
  </div>
  <div class="table-container-pagination">
    <mat-paginator [length]="length" [pageSizeOptions]="pageSizeOptions" (page)="updatePage($event)"
      aria-label="Select page">
    </mat-paginator>
  </div>
</div>
